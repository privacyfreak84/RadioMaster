# ----------------------------------------------------------------------
# [glyphs]
#
# Small icons and symbols used throughout the UI. Any value here can be
# a plain string (used regardless of the person's glyph-mode setting), or
# a small table with up to three tiers - nerd/unicode/ascii - that
# automatically picks the richest one the current glyph mode supports,
# falling back gracefully. Two entries below (app_icon, favorite) use
# that tiered form to demonstrate it; the rest use plain strings, which
# is the normal case for most themes.
# ----------------------------------------------------------------------

[glyphs]

# app_icon: shown next to the app name in a couple of places (like the
# "Lofi Stream CLI" title). The tiered form here means: use a Nerd Font
# icon if the person's glyph mode is "nerd", a Unicode symbol if it's
# "unicode" (the default), or a plain-ASCII fallback if it's "ascii" -
# for terminals/fonts that can't render either of the fancier tiers.
app_icon = { nerd = "\uf001 Reference", unicode = "◆ Reference", ascii = "[#] Reference" }

# favorite: the "starred" indicator on a favorited station.
favorite = { nerd = "\uf005", unicode = "★", ascii = "*" }

# status_playing / status_paused / status_idle / status_error: the small
# glyph shown next to the current playback status word (Streaming,
# Paused, Idle, Unavailable).
status_playing = "◆"
status_paused = "◇"
status_idle = "·"
status_error = "✕"

# spinner: cycles through these characters, one per animation frame,
# while a stream is resolving/loading.
spinner = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"

# volume_fill / volume_empty: the two characters that make up the volume
# bar display.
volume_fill = "▰"
volume_empty = "▱"

# hud_fill / hud_empty: same idea as volume_fill/empty, for any other
# progress-bar-style display.
hud_fill = "▰"
hud_empty = "▱"

# default_tag_icon: shown next to a station tag that isn't in the
# tag_icons table below.
default_tag_icon = "♫"

# selection_marker: only actually drawn when selection_style (set above)
# is "marker" - the glyph placed in front of the selected row's text
# instead of inverting the whole row.
selection_marker = "➤"

# section_marker: only actually drawn when section_header_style (set
# above) is "marker" - the glyph placed in front of section headers like
# "Context" or "Recent Sessions".
section_marker = "▣"

# header_cap: only actually drawn when header_style (set above) is
# "badge" - the shaded end caps flanking the badge. Give the LEFT cap
# only; the right one is the same string reversed automatically (so
# "░▒▓" becomes "▓▒░" on the right, mirroring it).
header_cap = "▒▓"

# empty_state_deco: only actually drawn when empty_state_style (set
