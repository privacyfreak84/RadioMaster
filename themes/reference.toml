# ----------------------------------------------------------------------
# [labels]
#
# Every piece of UI text the app looks up by name, listed here with its
# own built-in default wording (not re-worded) - so this section doubles
# as a complete vocabulary checklist. Copy this whole block into your own
# theme and only change the lines that need your theme's own voice; see
# the other builtin themes (retro_radio, cendre) for examples of themes
# that rewrote most of this into their own vocabulary, and the Fittonia
# demo theme for one that renamed literally everything into a botanical
# vocabulary.
# ----------------------------------------------------------------------

[labels]

# Pane titles (rendered as ascii_font block letters here, since
# ascii_title is true above) and tab strip labels.
title_stations = "Stations"
title_favorites = "Favorites"
tab_now_playing = "Now Playing"
tab_history = "History"
tab_stats = "Stats"

# Section headers and the debug-log overlay's own title.
context_header = "Context"
debug_header = "=== LIVE DEBUG LOGS ==="

# Field labels shown in the Context pane (metadata_style "aligned") or
# condensed into fewer lines (metadata_style "inline").
lbl_channel = "Channel"
lbl_tags = "Tags"
lbl_started = "Started"
lbl_listening = "Listening"
lbl_status = "Status"
lbl_volume = "Volume"
lbl_sleep_timer = "Sleep Timer"
lbl_folders = "Folders"
lbl_favorite = "Favorite"
lbl_played = "Played"
lbl_total_time = "Total Time"
lbl_last_played = "Last Played"
lbl_total_sessions = "Total Sessions"
lbl_avg_session = "Avg Session"
lbl_longest = "Longest"
lbl_today = "Today"
lbl_all_time = "All Time"

# The idle placeholder shown in the Now Playing pane before anything's
# ever been played this session.
now_playing_none = "Now Playing: None"

# The status word shown next to status_playing/paused/idle/error (the
# glyphs set above) - the two are always shown together.
status_word_playing = "Streaming"
status_word_paused = "Paused"
status_word_idle = "Idle"
status_word_resolving = "Resolving..."
status_word_unavailable = "Unavailable"
status_word_error = "Stream Unavailable"

# Error/problem messages.
stream_error = "Stream Error"
mpv_unavailable = "mpv not found in PATH - install mpv to enable playback"

# History and Stats tab section headers.
recent_sessions = "Recent Sessions"
session_summary = "Session Summary"
listening_time = "Listening Time"
most_played = "Most Played"

# The search dialog's own prompt text.
search_prompt = "Search"

# "Nothing here" messages - see empty_state_style above for how these
# render (plain text, or wrapped in empty_state_deco).
no_history = "(nothing played yet)"
no_stats_data = "(no data yet)"
no_station_selected = "(no station selected)"
no_search_results = "No results"
empty_folder = "This folder is empty"
no_stations = "No stations yet"
no_folders_yet = "(no folders yet)"
no_readd_candidates = "(none)"

# Footer keyboard-shortcut hints. Three tiers, picked automatically by
# how much horizontal room the terminal actually has - the widest one
# that fits wins, so a narrow terminal doesn't get truncated mid-word.
footer_controls = "[Enter]Play/Pause [1-3]View [a]Add [e]Edit [x]Del [o]Folder [O]Manage [m]Menu [f/F]Favs [s]Search [?]Help [q]Quit"
footer_controls_medium = "[Enter]Play/Pause [a/e/x]Add/Edit/Del [o/O]Folders [m]Menu [f/F]Favs [?]Help [q]Quit"
footer_controls_compact = "[Enter]Play/Pause [m]Menu [?]Help [q]Quit"
